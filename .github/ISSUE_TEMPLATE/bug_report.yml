name: Bug report
description: Sidecar is not reconnecting, or SidecarKeeper misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: "macOS 15.5, MacBook Air (Apple silicon)"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: How is the iPad connected?
      options: [USB cable, Wi-Fi, Both at different times, Not sure]
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `sidecar-keeper status`
      description: Remove any device name you would rather not share.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines from ~/Library/Logs/sidecar-keeper.log
      render: text
