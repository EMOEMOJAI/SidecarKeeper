name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a new runner image, a new Swift, or a vanished upstream commit is noticed
    # within days and not at the next release.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -S style install.sh uninstall.sh tests/*.sh assets/render.sh scripts/*.sh
      - name: Relative links in the docs
        run: python3 scripts/check-links.py
      - name: bash syntax
        run: bash -n install.sh uninstall.sh tests/*.sh assets/render.sh scripts/*.sh

  macos:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # macOS 14 runners retire on 2026-11-02, with failure windows before that. They still back
    # the "macOS 14.2 or newer" claim, so keep them, but never let them block anything.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
        experimental: [false]
        include:
          - os: macos-14
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          sw_vers
          swiftc --version
      - name: Build (warnings are errors)
        run: |
          mkdir -p build
          swiftc -O -warnings-as-errors -framework AppKit Sources/SidecarKeeper/main.swift -o build/sidecar-keeper
          build/sidecar-keeper --version
      - name: Behaviour tests
        # SK_TESTS_NO_SKIP: a locked session must fail the job instead of skipping it.
        run: SK_TESTS_NO_SKIP=1 tests/run.sh build/sidecar-keeper
      - name: Lint LaunchAgent template
        run: plutil -lint launchd/com.sidecarkeeper.plist.template
      - name: Install and uninstall for real
        # Builds the pinned upstream SidecarLauncher, loads the LaunchAgent, then removes it all.
        # No iPad exists here, so the watcher must start and sit idle without attempting a connect.
        run: |
          prefix="$RUNNER_TEMP/sidecarkeeper"
          ./install.sh --device "CI iPad" --no-link --prefix "$prefix"
          sleep 6
          "$prefix/bin/sidecar-keeper" status
          grep -q "watcher .* started" "$HOME/Library/Logs/sidecar-keeper.log"
          if grep -q "fail:" "$HOME/Library/Logs/sidecar-keeper.log"; then echo "watcher attempted a connect"; exit 1; fi
          plutil -lint "$HOME/Library/LaunchAgents/com.sidecarkeeper.agent.plist"
          ./uninstall.sh --prefix "$prefix" --purge-logs
          test ! -e "$prefix"
          test ! -e "$HOME/Library/LaunchAgents/com.sidecarkeeper.agent.plist"
      - name: Package a release bundle and install from it without developer tools
        run: |
          scripts/package.sh
          (cd dist && shasum -a 256 -c SidecarKeeper.tar.gz.sha256)
          mkdir "$RUNNER_TEMP/poison" "$RUNNER_TEMP/unpacked"
          for t in swiftc git xcodebuild; do printf '#!/bin/sh\necho "%s was called" >&2; exit 99\n' "$t" > "$RUNNER_TEMP/poison/$t"; chmod +x "$RUNNER_TEMP/poison/$t"; done
          tar -xzf dist/SidecarKeeper.tar.gz -C "$RUNNER_TEMP/unpacked"
          if tar -tvzf dist/SidecarKeeper.tar.gz | grep -v " root " ; then echo "archive records a non-root owner"; exit 1; fi
          prefix="$RUNNER_TEMP/sidecarkeeper-bundle"
          PATH="$RUNNER_TEMP/poison:$PATH" bash "$RUNNER_TEMP/unpacked/SidecarKeeper/install.sh" --device "CI iPad" --no-link --prefix "$prefix"
          sleep 5
          "$prefix/bin/sidecar-keeper" status
          bash "$prefix/uninstall.sh" --purge-logs
          test ! -e "$prefix"
      - name: The public one-liner, against the latest release
        # Only on the weekly and manual runs: a push must not depend on what is already released.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          prefix="$RUNNER_TEMP/sidecarkeeper-oneliner"
          /bin/bash -c "$(curl -fsSL https://github.com/EMOEMOJAI/SidecarKeeper/releases/latest/download/install.sh)" sk --device "CI iPad" --no-link --prefix "$prefix"
          sleep 5
          "$prefix/bin/sidecar-keeper" status
          bash "$prefix/uninstall.sh" --purge
          test ! -e "$prefix"

  upstream:
    name: Upstream pin
    # Weekly only. The SidecarLauncher commit install.sh pins never moves by itself, so
    # without this an upstream fix could sit unnoticed for months.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is the pinned SidecarLauncher commit still current?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          scripts/check-upstream.sh --open-issue || rc=$?
          # 0 = current, 3 = behind and an issue was opened. A stale pin is news, not a
          # failure, so the badge stays green; anything else means the check itself broke.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then exit "$rc"; fi
