name: Release

# Push a tag like v1.2.0 to build, verify and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build bundle
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the version in the source
        run: |
          version="$(sed -n 's/^let version = "\(.*\)"$/\1/p' Sources/SidecarKeeper/main.swift)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, source says $version"; exit 1; }
          grep -q "^## $version$" CHANGELOG.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Test
        run: SK_TESTS_NO_SKIP=1 make check
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Install the bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os: [macos-14, macos-15, macos-26]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Install with no developer tools, then uninstall
        run: |
          (cd dist && shasum -a 256 -c SidecarKeeper.tar.gz.sha256)
          # The one-liner entry point must parse, and must pin this exact version and archive.
          bash -n dist/install.sh
          grep -q "^BUNDLE_VERSION=\"${GITHUB_REF_NAME#v}\"$" dist/install.sh
          grep -q "^BUNDLE_SHA256=\"$(shasum -a 256 dist/SidecarKeeper.tar.gz | awk '{print $1}')\"$" dist/install.sh
          # The whole point of the bundle: it must never reach for a compiler or git.
          mkdir poison
          for t in swiftc git xcodebuild; do printf '#!/bin/sh\necho "%s was called" >&2; exit 99\n' "$t" > "poison/$t"; chmod +x "poison/$t"; done
          tar -xzf dist/SidecarKeeper.tar.gz
          prefix="$RUNNER_TEMP/sidecarkeeper"
          PATH="$PWD/poison:$PATH" bash SidecarKeeper/install.sh --device "CI iPad" --no-link --prefix "$prefix"
          sleep 6
          test "v$("$prefix/bin/sidecar-keeper" --version)" = "$GITHUB_REF_NAME"
          "$prefix/bin/sidecar-keeper" status
          grep -q "watcher .* started" "$HOME/Library/Logs/sidecar-keeper.log"
          if grep -q "fail:" "$HOME/Library/Logs/sidecar-keeper.log"; then echo "watcher attempted a connect"; exit 1; fi
          bash "$prefix/uninstall.sh" --purge-logs
          test ! -e "$prefix"

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SidecarKeeper.tar.gz
            dist/SidecarKeeper.tar.gz.sha256
            dist/install.sh
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            cat <<'NOTES'
          ## Install

          Unlock your iPad, then paste this into Terminal. It needs nothing but macOS: no Xcode, no git, no `sudo`.

          ```sh
          /bin/bash -c "$(curl -fsSL https://github.com/EMOEMOJAI/SidecarKeeper/releases/latest/download/install.sh)"
          ```

          Or download `SidecarKeeper.tar.gz` below, unpack it, and run `install.sh` from Terminal. Universal binary for Apple silicon and Intel, macOS 14.2 or newer. Remove it any time with `~/.sidecarkeeper/uninstall.sh`.

          The binaries were built by GitHub Actions from this tag. Verify that with `gh attestation verify SidecarKeeper.tar.gz --repo EMOEMOJAI/SidecarKeeper`.

          ## Changes

          NOTES
            awk -v v="$version" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } | sed 's/^          //' > notes.md
          gh release create "$GITHUB_REF_NAME" --title "SidecarKeeper $version" --notes-file notes.md --verify-tag \
            dist/SidecarKeeper.tar.gz dist/SidecarKeeper.tar.gz.sha256 dist/install.sh
